<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison</title>
    <link rel="stylesheet" href="Filter_Comparison_Layout.css">
</head>
<body>

<header>
    <h1>Before & After Filter</h1>
    <p>Compare the original and filtered image</p>
</header>

<main class="comparison">

    <figure>
        <img src="photo4.jpg" alt="Original image">
        <figcaption>Before - Original Image</figcaption>
    </figure>

    <figure class="after">
        <img src="photo4.jpg" alt="Filtered image">
        <figcaption>After - Filtered Image</figcaption>
    </figure>

</main>

<footer>
    <p>CSS Filter Comparison</p>
</footer>

</body>
</html>
