<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Profile Cards</title>
    <link rel="stylesheet" href="Filter_Cards_with_Animation.css">
</head>
<body>

<header>
    <h1>Our Team</h1>
    <p>Profile cards with CSS filters and animation</p>
</header>

<main class="profiles">

    <article class="profile">
        <img class="gray" src="pic1.jpg" alt="Profile">
        <h2>Alex</h2>
        <p>Frontend Developer</p>
    </article>

    <article class="profile">
        <img class="sepia" src="pic2.jpg" alt="Profile">
        <h2>Sarah</h2>
        <p>UI Designer</p>
    </article>

    <article class="profile">
        <img class="contrast" src="pic3.jpg" alt="Profile">
        <h2>David</h2>
        <p>Web Developer</p>
    </article>

</main>

<footer>
    <p>Profile Card Animation</p>
</footer>

</body>
</html>
