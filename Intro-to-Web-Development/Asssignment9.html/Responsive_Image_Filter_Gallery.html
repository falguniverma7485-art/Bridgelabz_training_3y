<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Filter Gallery</title>
    <link rel="stylesheet" href="Responsive_Image_Filter_Gallery.css">
</head>
<body>

<header>
    <h1>Image Filter Gallery</h1>
    <p>Different CSS filters on different images</p>
</header>

<main class="gallery">

    <figure class="image-card">
        <img class="blur" src="photo1.jpg" alt="Nature">
        <figcaption>Blur Effect</figcaption>
    </figure>

    <figure class="image-card">
        <img class="gray" src="photo2.jpg" alt="Mountain">
        <figcaption>Grayscale Effect</figcaption>
    </figure>

    <figure class="image-card">
        <img class="sepia" src="photo3.jpg" alt="Beach">
        <figcaption>Sepia Effect</figcaption>
    </figure>

    <figure class="image-card">
        <img class="bright" src="photo4.jpg" alt="Forest">
        <figcaption>Brightness Effect</figcaption>
    </figure>

    <figure class="image-card">
        <img class="contrast" src="photo5.jpg" alt="City">
        <figcaption>Contrast Effect</figcaption>
    </figure>

    <figure class="image-card">
        <img class="hue" src="photo6.jpg" alt="Sunset">
        <figcaption>Hue Rotate Effect</figcaption>
    </figure>

</main>

<footer>
    <p>CSS Image Filter Practice</p>
</footer>

</body>
</html>
