<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Classes</title>
    <link rel="stylesheet" href="q1.css">
</head>
<body>

<header>
    <h1>Pseudo-Class Showcase</h1>
    <p>Hover, focus, active and nth-child examples</p>
</header>

<main>
    <div class="example">
        <h2>Link</h2>
        <a href="#">Hover over this link</a>
        <small>:hover</small>
    </div>

    <div class="example">
        <h2>Button</h2>
        <button>Click Me</button>
        <small>:active</small>
    </div>

    <div class="example">
        <h2>Input</h2>
        <input type="text" placeholder="Click here">
        <small>:focus</small>
    </div>

    <div class="example">
        <h2>List</h2>
        <ul>
            <li>First Item</li>
            <li>Second Item</li>
            <li>Third Item</li>
            <li>Fourth Item</li>
        </ul>
        <small>:nth-child()</small>
    </div>
</main>

<footer>
    <p>CSS Pseudo-Class Practice</p>
</footer>

</body>
</html>
