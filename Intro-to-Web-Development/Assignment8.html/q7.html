<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Components</title>
    <link rel="stylesheet" href="q7.css">
</head>
<body>

<header>
    <h1>Simple UI Dashboard</h1>
</header>

<main>

    <div class="search-area">
        <input type="search" placeholder="Search something...">
        <button>Search</button>

        <select>
            <option>Select Category</option>
            <option>Technology</option>
            <option>Education</option>
            <option>Projects</option>
        </select>
    </div>

    <section class="cards">

        <div class="card">
            <h2>Technology</h2>
            <p>Explore modern technology and web development.</p>
            <button>View More</button>
        </div>

        <div class="card active-card">
            <h2>Projects</h2>
            <p>Check out interesting student projects.</p>
            <button>View More</button>
        </div>

        <div class="card">
            <h2>Learning</h2>
            <p>Improve your skills with regular practice.</p>
            <button>View More</button>
        </div>

    </section>

</main>

<footer>
    <p>© 2026 UI Components</p>
</footer>

</body>
</html>
