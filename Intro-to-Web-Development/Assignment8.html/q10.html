<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface</title>
    <link rel="stylesheet" href="q10.css">
</head>
<body>

<header>
    <div class="logo">MyUI</div>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
</header>

<main>

    <section class="main-card">

        <div class="content">

            <div class="text">
                <h1>Welcome to My UI</h1>

                <p>
                    This mini interface demonstrates forms,
                    buttons, CSS box-sizing, shadows, borders
                    and interactive pseudo-classes.
                </p>

                <form>
                    <input type="text" placeholder="Your Name">
                    <input type="email" placeholder="Your Email">
                    <button type="submit">Submit</button>
                </form>
            </div>

            <div class="image">
                <img src="small.jpg" alt="Small UI image">
            </div>

        </div>

    </section>

</main>

<footer>
    <p>© 2026 MyUI | Simple CSS Interface</p>
</footer>

</body>
</html>
