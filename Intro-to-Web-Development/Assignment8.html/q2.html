<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tooltips</title>
    <link rel="stylesheet" href="q2.css">
</head>
<body>

<header>
    <h1>CSS Tooltip Gallery</h1>
    <p>Hover over each item to see its tooltip</p>
</header>

<main>
    <div class="tooltip">
        HTML
        <span class="tip">Structure of a webpage</span>
    </div>

    <div class="tooltip">
        CSS
        <span class="tip">Styles and designs webpages</span>
    </div>

    <div class="tooltip">
        Grid
        <span class="tip">Creates two-dimensional layouts</span>
    </div>

    <div class="tooltip">
        Flexbox
        <span class="tip">Creates flexible layouts</span>
    </div>
</main>

<footer>
    <p>Pure CSS Tooltip Demonstration</p>
</footer>

</body>
</html>
