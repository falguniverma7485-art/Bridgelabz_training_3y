<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="q3.css">
</head>
<body>

<header>
    <h1>My Photo Gallery</h1>
    <p>Hover over an image to explore</p>
</header>

<main class="gallery">

    <figure>
        <img src="photo1.jpg" alt="Nature">
        <figcaption>Beautiful Nature</figcaption>
    </figure>

    <figure>
        <img src="photo2.jpg" alt="Mountain">
        <figcaption>Mountain View</figcaption>
    </figure>

    <figure>
        <img src="photo3.jpg" alt="Beach">
        <figcaption>Peaceful Beach</figcaption>
    </figure>

    <figure>
        <img src="photo4.jpg" alt="Forest">
        <figcaption>Green Forest</figcaption>
    </figure>

    <figure>
        <img src="photo5.jpg" alt="City">
        <figcaption>City Lights</figcaption>
    </figure>

    <figure>
        <img src="photo6.jpg" alt="Sunset">
        <figcaption>Beautiful Sunset</figcaption>
    </figure>

</main>

<footer>
    <p>© 2026 My Photo Gallery</p>
</footer>

</body>
</html>
