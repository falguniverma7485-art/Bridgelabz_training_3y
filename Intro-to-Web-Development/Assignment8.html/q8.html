<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Sizing</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>

<header>
    <h1>Box-Sizing Comparison</h1>
    <p>Understanding content-box and border-box</p>
</header>

<main>

    <div class="box content-box">
        <h2>Content-Box</h2>
        <p>Width = 300px</p>
        <p>Padding and border are added outside the width.</p>
    </div>

    <div class="box border-box">
        <h2>Border-Box</h2>
        <p>Width = 300px</p>
        <p>Padding and border are included inside the width.</p>
    </div>

</main>

<footer>
    <p>CSS Box-Sizing Practice</p>
</footer>

</body>
</html>
