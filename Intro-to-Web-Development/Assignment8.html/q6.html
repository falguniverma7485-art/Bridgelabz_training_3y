<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations</title>
    <link rel="stylesheet" href="q6.css">
</head>
<body>

<header>
    <h1>CSS Animation Showcase</h1>
    <p>Three different animations using keyframes</p>
</header>

<main>

    <div class="animation-box move">
        <span>Move</span>
    </div>

    <div class="animation-box bounce">
        <span>Bounce</span>
    </div>

    <div class="animation-box change">
        <span>Color</span>
    </div>

</main>

<footer>
    <p>CSS Keyframe Animation Practice</p>
</footer>

</body>
</html>
