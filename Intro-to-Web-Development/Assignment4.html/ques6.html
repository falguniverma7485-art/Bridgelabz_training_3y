<!DOCTYPE html>
<html>
<head>
    <title>Photo Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #eeeeee;
        }

        h1 {
            text-align: center;
            padding: 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 30px;
        }

        .photo {
            background-color: white;
            padding: 10px;
            text-align: center;
            border: 1px solid #aaa;
        }

        .photo img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .photo:hover {
            transform: scale(1.03);
        }

        @media screen and (max-width: 700px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">

        <div class="photo">
            <img src="nature.jpeg" alt="Nature">
            <p>Beautiful Nature</p>
        </div>

        <div class="photo">
            <img src="mountain.jpeg" alt="Mountain">
            <p>Mountain View</p>
        </div>

        <div class="photo">
            <img src="beach.jpeg" alt="Beach">
            <p>Beach</p>
        </div>

        <div class="photo">
            <img src="sunset.jpeg" alt="Sunset">
            <p>Sunset</p>
        </div>

        <div class="photo">
            <img src="greenforest.jpeg" alt="Forest">
            <p>Green Forest</p>
        </div>

        <div class="photo">
            <img src="city image.jpeg" alt="City">
            <p>City View</p>
        </div>

    </div>

</body>
</html>
