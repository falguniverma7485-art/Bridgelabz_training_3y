<!DOCTYPE html>
<html>
<head>
    <title>Team Members</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eeeeee;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        .team {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }

        .card {
            background-color: white;
            width: 30%;
            padding: 25px;
            margin: 10px;
            border: 2px solid #aaa;
            border-radius: 15px;
            box-shadow: 3px 3px 10px #aaa;
        }

        .leader {
            background-color: #ffe5b4;
            border: 3px solid #ff8800;
        }

        .card h2 {
            margin-top: 0;
        }

        @media screen and (max-width: 600px) {
            .team {
                flex-direction: column;
            }

            .card {
                width: auto;
            }
        }
    </style>
</head>

<body>

    <h1>Our Team Members</h1>

    <div class="team">

        <div class="card leader">
            <h2>Falguni</h2>
            <h3>Team Lead</h3>
            <p>
                Falguni manages the team and helps in completing
                the project work on time.
            </p>
        </div>

        <div class="card">
            <h2>Rahul</h2>
            <h3>Developer</h3>
            <p>
                Rahul works on coding and helps in developing
                different parts of the project.
            </p>
        </div>

        <div class="card">
            <h2>Priyanka</h2>
            <h3>Designer</h3>
            <p>
                Priyanka looks after the design and presentation
                of the project.
            </p>
        </div>

    </div>

</body>
</html>
