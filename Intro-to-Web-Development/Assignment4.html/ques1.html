<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            padding-bottom: 60px;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: #222;
            color: white;
            padding: 15px 30px;
            z-index: 10;
        }

        header h2 {
            display: inline;
            margin-right: 40px;
        }

        nav {
            display: inline;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }

        main {
            min-height: 80vh;
            padding: 130px 10%;
        }

        .intro {
            max-width: 700px;
        }

        .intro h1 {
            font-size: 40px;
        }

        .intro p {
            font-size: 1.2em;
            line-height: 1.6;
        }

        .profile {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #333;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            text-align: center;
            background-color: #222;
            color: white;
            padding: 12px;
        }
    </style>
</head>

<body>

    <header>
        <h2>Falguni Verma</h2>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <div class="intro">
            <h1>Hello, I am Falguni</h1>

            <p>
                I am a B.Tech CSE student interested in web development
                and learning new technologies. I like creating simple
                and useful webpages while improving my coding skills.
            </p>

            <img src="falguni.jpeg" alt="My Profile Image" class="profile">
        </div>
    </main>

    <footer>
        © 2026 Falguni Verma
    </footer>

</body>
</html>
