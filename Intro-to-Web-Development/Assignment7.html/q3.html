<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Webpage</title>
    <link rel="stylesheet" href="q3.css">
</head>
<body>

    <header>
        <h1>Gradient World</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Gallery</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <section class="linear">
            <h2>Linear Gradient</h2>
            <p>
                This section uses a linear-gradient background.
                The colors smoothly change from one side to another.
            </p>
        </section>

        <section class="radial">
            <h2>Radial Gradient</h2>
            <p>
                This section uses a radial-gradient background.
                The colors spread from the center outward.
            </p>
        </section>
    </main>

    <footer>
        <p>© 2026 Gradient Webpage</p>
    </footer>

</body>
</html>
