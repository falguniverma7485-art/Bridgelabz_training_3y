<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations</title>
    <link rel="stylesheet" href="q6.css">
</head>
<body>

    <header>
        <h1>CSS Transformations</h1>
        <p>Hover over each box to see the transformation</p>
    </header>

    <main>

        <div class="transform-card">
            <div class="box rotate">Rotate</div>
            <p>transform: rotate()</p>
        </div>

        <div class="transform-card">
            <div class="box scale">Scale</div>
            <p>transform: scale()</p>
        </div>

        <div class="transform-card">
            <div class="box translate">Translate</div>
            <p>transform: translate()</p>
        </div>

        <div class="transform-card">
            <div class="box skew">Skew</div>
            <p>transform: skew()</p>
        </div>

    </main>

    <footer>
        <p>CSS Transform Practice</p>
    </footer>

</body>
</html>
