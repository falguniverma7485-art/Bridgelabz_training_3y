<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline Formatting</title>
</head>
<body>
     <p>
        I am <strong>learning HTML</strong> and
        <em>enjoying the process</em>.
        <mark>Practice is important</mark> for improving my skills.
        <br>
        <small>Learning step by step.</small>
    </p>
</body>
</html>
