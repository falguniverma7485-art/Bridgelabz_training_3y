<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip</title>
    <link rel="stylesheet" href="q9.css">
</head>
<body>

    <main class="container">

        <div class="card">

            <div class="card-inner">

                <div class="card-front">
                    <img src="https://picsum.photos/id/180/500/300" alt="Laptop">
                    <h2>Web Development</h2>
                </div>

                <div class="card-back">
                    <h2>Web Development</h2>
                    <p>
                        Web development is the process of creating websites
                        using technologies such as HTML and CSS.
                    </p>
                </div>

            </div>

        </div>

    </main>

</body>
</html>
