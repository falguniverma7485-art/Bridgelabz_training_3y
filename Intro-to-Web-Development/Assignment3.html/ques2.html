<!DOCTYPE html>
<html>
<head>
    <title>Product Catalog</title>
</head>

<body>
    <h1>My Product Catalog</h1>

    <table border="1">

        <tr>
            <th colspan="5">Available Products</th>
        </tr>

        <tr>
            <th>Product Name</th>
            <th>Image</th>
            <th>Description</th>
            <th>Price</th>
            <th>Availability</th>
        </tr>

        <tr>
            <td>Laptop</td>
            <td>
                <img src="laptop.jpg.avif" 
                     alt="Laptop Image" width="100">
            </td>
            <td>A laptop suitable for students and programming.</td>
            <td>₹50,000</td>
            <td rowspan="2">In Stock</td>
        </tr>

        <tr>
            <td>Headphones</td>
            <td>
                <img src="headphones.jpg" 
                     alt="Headphones Image" width="100">
            </td>
            <td>Wireless headphones with good sound quality.</td>
            <td>₹2,000</td>
        </tr>

        <tr>
            <td>Keyboard</td>
            <td>
                <img src="keyboard.jpg" 
                     alt="Keyboard Image" width="100">
            </td>
            <td>A simple keyboard for daily use.</td>
            <td>₹1,500</td>
            <td>Out of Stock</td>
        </tr>

    </table>

</body>
</html>
