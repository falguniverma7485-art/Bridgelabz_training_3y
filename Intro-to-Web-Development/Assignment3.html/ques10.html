<!DOCTYPE html>
<html>
<head>
    <title>Travel Selection Page</title>
</head>

<body>

    <h1>Travel Selection</h1>

    <form>

        <label for="country">Select Country:</label>

        <select id="country" name="country">
            <option selected>India</option>
            <option>USA</option>
            <option>Japan</option>
            <option>Australia</option>
        </select>

        <br><br>

        <label for="state">Select State:</label>

        <select id="state" name="state">
            <option selected>Uttar Pradesh</option>
            <option>Maharashtra</option>
            <option>Rajasthan</option>
            <option>Goa</option>
        </select>

        <br><br>

        <label for="city">Select City:</label>

        <select id="city" name="city">
            <option selected>Mathura</option>
            <option>Agra</option>
            <option>Delhi</option>
            <option>Jaipur</option>
        </select>

        <br><br>

        <label for="place">Favorite Tourist Place:</label>

        <select id="place" name="place">
            <option selected>Taj Mahal</option>
            <option>India Gate</option>
            <option>Red Fort</option>
            <option>Gateway of India</option>
        </select>

    </form>

    <h2>My Choices</h2>

    <p>
        I have selected India as my country, Uttar Pradesh as my state,
        Mathura as my city and Taj Mahal as my favorite tourist place.
    </p>

</body>
</html>
