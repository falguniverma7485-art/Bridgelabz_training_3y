<!DOCTYPE html>
<html>
<head>
    <title>Feedback Form</title>
</head>
<body>

    <h1>Feedback Form</h1>

    <form action="#" method="post">

        <label>Write your feedback:</label><br>
        <textarea name="feedback" rows="5" cols="40"></textarea>

        <p>How was your experience?</p>

        <input type="radio" name="rating" value="Good">
        <label>Good</label><br>

        <input type="radio" name="rating" value="Average">
        <label>Average</label><br>

        <input type="radio" name="rating" value="Poor">
        <label>Poor</label><br><br>

        <input type="submit" value="Submit Feedback">

    </form>

</body>
</html>
