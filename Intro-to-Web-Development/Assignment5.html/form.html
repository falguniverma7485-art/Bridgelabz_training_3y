<!DOCTYPE html>
<html>
<head>
    <title>Simple Form</title>
</head>
<body>

    <h1>Submit Form</h1>

    <form action="result.html" target="resultFrame">
        <label>Enter your name:</label>
        <input type="text" name="name">
        <br><br>

        <input type="submit" value="Submit">
    </form>

    <br>

    <iframe
        name="resultFrame"
        width="80%"
        height="150"
        title="Result">
    </iframe>

</body>
</html>
